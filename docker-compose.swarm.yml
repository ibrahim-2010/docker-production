version: '3.9'

services:
  web:
    image: flask-app:v2.0
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
    deploy:
      replicas: 1
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    networks:
      - app-network

networks:
  app-network:
    driver: overlay